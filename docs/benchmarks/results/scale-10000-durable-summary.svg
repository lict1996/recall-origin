<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">RecallOrigin 10k durable local benchmark</title>
<desc id="desc">Measured Recall at 10, mean reciprocal rank, search latency, and durable ingest throughput on a deterministic synthetic corpus.</desc>
<style>
.title{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#EAF1FF}
.subtitle{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#9DB0CE}
